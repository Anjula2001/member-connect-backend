spring.application.name=member-connect-backend

# PostgreSQL datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://db.oxitbkfnbikshztdyyaw.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:SE-V5codex-G5}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.error.include-message=always

# Multipart upload limits (-1 for unlimited file size)
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

# AWS Configuration
aws.accessKey=${AWS_ACCESS_KEY:}
aws.secretKey=${AWS_SECRET_KEY:}
aws.region=${AWS_REGION:ap-south-1}
aws.bucketName=${AWS_BUCKET_NAME:memberconnect-documents}

# Notifications
# Both channels default to OFF, which selects the logging senders: messages are
# written to the application log and no external provider is contacted. Real
# email is only ever sent when NOTIFY_EMAIL_ENABLED=true AND the SMTP_* values
# below are supplied through the environment.
notification.email.enabled=${NOTIFY_EMAIL_ENABLED:false}
notification.email.from=${NOTIFY_EMAIL_FROM:no-reply@ffi.lk}
# No real SMS gateway is integrated yet. Setting this to true does not send an
# SMS - it makes LoggingSmsSender warn that real delivery was requested and did
# not happen. It is the switch point for a future provider.
notification.sms.enabled=${NOTIFY_SMS_ENABLED:false}

# SMTP - only read when notification.email.enabled=true.
# Credentials come from the environment/.env, never from this file.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Scholarship
scholarship.required.remitted.months=12
grade5.scholarship.required.remitted.months=6
scholarship.lookback.years=1
# Which source answers "is this member financially eligible for a Scholarship?"
#   member  - temporary: the Member.is_remittance / is_settlement flags
#   finance - the real month-by-month Remittance/Settlement checks
# Both code paths are live; this only decides which one saveRequest calls.
scholarship.finance.validation.source=member
university.scholarship.minor.required.amount=500
university.scholarship.minor.required.months=120
university.scholarship.minor.multiplier.percent=150
grade5.minor.account.required.remittance.amount=250.0
minor.account.required.remittance.amount=250.0

# JWT
jwt.secret=${JWT_SECRET}

# Dispatch: when true only members with Card + Signature Card + Passbook printed
# can be dispatched; set false to ignore printing and dispatch on filters alone.
dispatch.require.all.documents.printed=${DISPATCH_REQUIRE_ALL_PRINTED:true}
