spring.application.name=member-connect-backend

# PostgreSQL datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/member_connect_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.error.include-message=always

# Multipart upload limits (default is 1MB which blocks PDFs)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB

# AWS Configuration
aws.accessKey=${AWS_ACCESS_KEY:}
aws.secretKey=${AWS_SECRET_KEY:}
aws.region=${AWS_REGION:ap-south-1}
aws.bucketName=${AWS_BUCKET_NAME:memberconnect-documents}

# Notifications
# Both channels default to OFF, which selects the logging senders: messages are
# written to the application log and no external provider is contacted. Real
# email is only ever sent when NOTIFICATION_EMAIL_ENABLED=true AND the MAIL_*
# values below are supplied through the environment.
notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:false}
notification.email.from=${MAIL_FROM:no-reply@memberconnect.local}
# No real SMS gateway is integrated yet. Setting this to true does not send an
# SMS - it makes LoggingSmsSender warn that real delivery was requested and did
# not happen. It is the switch point for a future provider.
notification.sms.enabled=${NOTIFICATION_SMS_ENABLED:false}

# SMTP - only read when notification.email.enabled=true.
# Credentials come from the environment/.env, never from this file.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Scholarship
scholarship.required.remitted.months=12
scholarship.lookback.years=1
university.scholarship.minor.required.amount=500
university.scholarship.minor.required.months=120
university.scholarship.minor.multiplier.percent=150
