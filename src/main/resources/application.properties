spring.application.name=member-connect-backend

# PostgreSQL datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://db.oxitbkfnbikshztdyyaw.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:SE-V5codex-G5}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Performance tuning for a REMOTE database -------------------------------
#
# The database is a managed Postgres roughly 60-105 ms away (measured), so every
# SQL statement costs a WAN round trip and the defaults - which assume a local
# DB - are wrong here in both directions.
#
# show-sql is off above: it formats and writes every statement to stdout
# synchronously, which on Windows is slow and blocking.

# Lazy loads must not fire during JSON serialization, after the controller has
# already returned - each one would be another 60 ms round trip that no code
# path makes visible. With this off they raise LazyInitializationException
# instead, so the fetch has to be made explicit (JOIN FETCH / @EntityGraph).
spring.jpa.open-in-view=false

# Collapse N lazy loads of the same association into one IN (...) batch.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Fewer network fetches per large result set.
spring.jpa.properties.hibernate.jdbc.fetch_size=200

# --- Connection pool ---------------------------------------------------------
#
# DELIBERATELY SMALL. The DigitalOcean plan allows ~22 non-superuser connections
# for the WHOLE cluster, shared by every developer and every running instance.
# Hikari's default of 10 per instance means two instances - which is easy to do
# by accident, leaving one running and starting another - exhausts the cluster
# and the next connect fails with:
#
#   FATAL: remaining connection slots are reserved for roles with the
#          SUPERUSER attribute
#
# Raising this number is the wrong instinct: it starves the cluster faster. If
# the app genuinely needs more concurrency, move it into the database's region
# (so each query holds a connection for ~1 ms instead of ~60 ms) or put
# PgBouncer in front - do not grow the pool.
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2

# Keep established connections warm. Every new connection pays a TLS handshake
# (sslmode=require), which is several extra round trips on top of the 60 ms.
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=1500000

# Fail fast instead of hanging. The default is 30 s, so a starved pool presents
# to the user as a page that hangs for half a minute rather than an error.
spring.datasource.hikari.connection-timeout=8000

# Surface connections the app forgot to return, which is how a pool this small
# ends up permanently starved.
spring.datasource.hikari.leak-detection-threshold=20000

# Server
server.error.include-message=always

# Multipart upload limits (-1 for unlimited file size)
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

# AWS Configuration
aws.accessKey=${AWS_ACCESS_KEY:}
aws.secretKey=${AWS_SECRET_KEY:}
aws.region=${AWS_REGION:ap-south-1}
aws.bucketName=${AWS_BUCKET_NAME:memberconnect-documents}

# Notifications
# Both channels default to OFF, which selects the logging senders: messages are
# written to the application log and no external provider is contacted. Real
# email is only ever sent when NOTIFY_EMAIL_ENABLED=true AND the SMTP_* values
# below are supplied through the environment.
notification.email.enabled=${NOTIFY_EMAIL_ENABLED:false}
notification.email.from=${NOTIFY_EMAIL_FROM:no-reply@ffi.lk}
# No real SMS gateway is integrated yet. Setting this to true does not send an
# SMS - it makes LoggingSmsSender warn that real delivery was requested and did
# not happen. It is the switch point for a future provider.
notification.sms.enabled=${NOTIFY_SMS_ENABLED:false}

# SMTP - only read when notification.email.enabled=true.
# Credentials come from the environment/.env, never from this file.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Scholarship
scholarship.required.remitted.months=12
grade5.scholarship.required.remitted.months=6
scholarship.lookback.years=1

scholarship.finance.validation.source=member
university.scholarship.minor.required.amount=500
university.scholarship.minor.required.months=120
university.scholarship.minor.multiplier.percent=150
grade5.minor.account.required.remittance.amount=250.0
minor.account.required.remittance.amount=250.0

# JWT
jwt.secret=${JWT_SECRET}

# Dispatch: when true only members with Card + Signature Card + Passbook printed
# can be dispatched; set false to ignore printing and dispatch on filters alone.
dispatch.require.all.documents.printed=${DISPATCH_REQUIRE_ALL_PRINTED:true}

# Outbound hand-offs to Finance (termination, member death, death donation
# MMD08). Off by default: with it off each hand-off is logged in full and
# nothing is sent, so the approval flows run exactly as they will in production.
finance.integration.enabled=${FINANCE_INTEGRATION_ENABLED:false}

# Where the Finance Module lives. Point this at /mock-finance to use the
# stand-in below.
finance.base-url=${FINANCE_BASE_URL:}

# Death Donation entitlement figures (months remitted, past-12-month donations,
# Special Fixed Account for Funerals) come from the Finance Module. Off by
# default: with no Finance Module the snapshot is zeroed and the operator enters
# the figures by hand, which the SRS allows for all three editable fields.
finance.death-donation.enabled=${FINANCE_DEATH_DONATION_ENABLED:false}

# Stand-in Finance Module, for demos and UAT before the real one exists.
#
# It serves the genuine Finance contract over HTTP, so turning it on exercises
# the production client rather than bypassing it - on the day Finance goes live
# the only change is finance.base-url.
#
# To switch it on, set all three:
#   FINANCE_MOCK_ENABLED=true
#   FINANCE_DEATH_DONATION_ENABLED=true
#   FINANCE_BASE_URL=http://localhost:8080/mock-finance
#
# all three of which can go straight into .env.
#
# Leave finance.integration.enabled=false while demoing. It is shared with the
# termination and member-death hand-offs, which the mock does not answer; the
# death donation hand-off is logged in full either way.
finance.mock.enabled=${FINANCE_MOCK_ENABLED:false}

# --- Dormant Membership (SRS section 4) -------------------------------------
#
# MMD10 measures dormancy from Member.lastActivityDate, falling back to the
# membership start date when nothing has been recorded. Every member in the demo
# data joined within the last few months, so against a twelve-month cutoff none
# of them is genuinely dormant and Run Identification correctly finds nothing.
#
# Turn this on for ONE startup to age a few MEM-DEMO- members past the cutoff,
# then turn it back off. It never touches a non-demo member id.
dormant.seed.demo-candidates=${DORMANT_SEED_DEMO_CANDIDATES:false}
dormant.seed.demo-candidate-count=${DORMANT_SEED_DEMO_CANDIDATE_COUNT:3}

# One-off repair for databases where the superseded DormantDataSeeder stamped
# lastActivityDate = today on every member. Off by default; the service now
# falls back to membershipStartDate at read time, so this is rarely needed.
dormant.seed.backfill-activity=${DORMANT_SEED_BACKFILL_ACTIVITY:false}

# --- Minor Savings Accounts (MMT01 disbursement panel) -----------------------
#
# minor_savings_account is empty on the demo database, so the "Minor Saving
# Disbursement" section on a termination or retirement request renders as an
# empty table for every member.
#
# Turn this on for ONE startup to give every ACTIVE member 1-3 accounts, then
# turn it back off. Two things to know before you do:
#   - it reaches real members too, not only MEM-DEMO- ones (rows stay removable
#     via the MSA-DEMO- account prefix; see db/undo-demo-seed.sql);
#   - a member with minor savings accounts must then upload the mandatory
#     "Minor Savings Account Disbursement Instruction" and fill disbursement
#     bank details before their termination/retirement request can be submitted.
minor.savings.seed.demo=${MINOR_SAVINGS_SEED_DEMO:false}
