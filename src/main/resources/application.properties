spring.application.name=member-connect-backend

# PostgreSQL datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/member_connect_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.error.include-message=always

# Multipart upload limits (default is 1MB which blocks PDFs)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB

# AWS Configuration
aws.accessKey=${AWS_ACCESS_KEY:}
aws.secretKey=${AWS_SECRET_KEY:}
aws.region=${AWS_REGION:ap-south-1}
aws.bucketName=${AWS_BUCKET_NAME:memberconnect-documents}

# Scholarship
scholarship.required.remitted.months=12
grade5.scholarship.required.remitted.months=6
scholarship.lookback.years=1
university.scholarship.minor.required.amount=500
university.scholarship.minor.required.months=120
university.scholarship.minor.multiplier.percent=150
grade5.minor.account.required.remittance.amount=250.0
minor.account.required.remittance.amount=250.0

# JWT
jwt.secret=${JWT_SECRET}

# Notifications
# Email is real SMTP; set notifications.email.enabled=true and supply credentials
# to actually send. SMS is a stub in NotificationService (logged, never sent).
notifications.email.enabled=${NOTIFY_EMAIL_ENABLED:false}
notifications.email.from=${NOTIFY_EMAIL_FROM:no-reply@ffi.lk}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Dispatch: when true only members with Card + Signature Card + Passbook printed
# can be dispatched; set false to ignore printing and dispatch on filters alone.
dispatch.require.all.documents.printed=${DISPATCH_REQUIRE_ALL_PRINTED:true}
